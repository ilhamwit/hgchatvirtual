<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HG Chat AI Agent — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#C9A84C; --gold2:#E8C96A; --gold3:#F5DFA0;
  --dark:#0A0A0E; --dark2:#111118; --dark3:#16161F;
  --font:'Inter',-apple-system,sans-serif;
  --serif:'Playfair Display',serif;
}
html,body{height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;}
body{font-family:var(--font);background:var(--dark);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}

.login-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.12;}
.bg-orb-1{width:500px;height:500px;background:var(--gold);top:-100px;left:-100px;animation:orbFloat 8s ease-in-out infinite;}
.bg-orb-2{width:400px;height:400px;background:var(--gold2);bottom:-80px;right:-80px;animation:orbFloat 10s ease-in-out infinite reverse;}
.bg-orb-3{width:300px;height:300px;background:#fff;top:50%;left:50%;transform:translate(-50%,-50%);animation:orbFloat 12s ease-in-out infinite;opacity:.04;}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(20px,-20px) scale(1.05);}66%{transform:translate(-15px,15px) scale(.95);}}

.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.04) 1px,transparent 1px);background-size:60px 60px;}

.login-card{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  padding:48px 44px 40px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(201,168,76,.15);
  border-radius:24px;
  backdrop-filter:blur(20px);
  box-shadow:0 0 0 1px rgba(201,168,76,.05),0 32px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  min-width:380px;
  animation:cardIn .6s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}

.login-logo-wrap{width:80px;height:80px;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(201,168,76,.4));animation:logoGlow 3s ease-in-out infinite;}
@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 20px rgba(201,168,76,.4));}50%{filter:drop-shadow(0 0 35px rgba(232,201,106,.7));}}
.login-logo-wrap img{width:100%;height:100%;object-fit:contain;}

.login-brand{font-family:var(--serif);font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold2),var(--gold3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;margin-bottom:4px;text-align:center;}
.login-tagline{font-size:11px;font-weight:500;color:rgba(255,255,255,.3);letter-spacing:3px;text-transform:uppercase;margin-bottom:36px;text-align:center;}

.login-divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.2),transparent);margin-bottom:30px;}

.pin-label{font-size:12px;font-weight:500;color:rgba(255,255,255,.4);letter-spacing:1px;text-transform:uppercase;margin-bottom:18px;text-align:center;}

.field-group{width:100%;margin-bottom:14px;}
.field-label{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;display:block;}
.field-input{
  width:100%;height:48px;border-radius:12px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.04);
  color:#fff;font-size:14px;font-weight:500;font-family:var(--font);
  padding:0 16px;outline:none;
  transition:all .15s;
}
.field-input::placeholder{color:rgba(255,255,255,.2);}
.field-input:focus{border-color:rgba(201,168,76,.4);background:rgba(201,168,76,.05);box-shadow:0 0 0 3px rgba(201,168,76,.08);}

.login-btn{
  width:100%;height:50px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#1A1206;font-size:14px;font-weight:700;letter-spacing:.3px;
  cursor:pointer;font-family:var(--font);margin-top:8px;
  transition:all .12s;
}
.login-btn:hover{opacity:.9;transform:translateY(-1px);}
.login-btn:active{transform:scale(.98);}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
.shake{animation:shake .35s ease;}

.login-status{margin-top:20px;font-size:12px;font-weight:500;color:rgba(255,255,255,.25);text-align:center;min-height:18px;transition:all .2s;letter-spacing:.3px;}
.login-status.error{color:#EF4444;}
.login-status.ok{color:#22C55E;}

.login-footer{position:absolute;bottom:24px;display:flex;align-items:center;gap:6px;font-size:10.5px;color:rgba(255,255,255,.18);letter-spacing:.5px;}
</style>
</head>

  <div class="login-brand">HG CHAT AI AGENT</div>
  <div class="login-tagline">Agent Intelligence Platform</div>
  <div class="login-divider"></div>
  <div class="pin-label">Sign in to continue</div>

  <form id="loginForm" autocomplete="on">
    <div class="field-group">
      <label class="field-label" for="fUser">Username</label>
      <input class="field-input" id="fUser" name="username" type="text" placeholder="Username" autocomplete="username" required>
    </div>
    <div class="field-group">
      <label class="field-label" for="fPass">Password</label>
      <input class="field-input" id="fPass" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>

<div class="login-footer">HG Chat AI Agent &nbsp;·&nbsp; v1.0 &nbsp;·&nbsp; All rights reserved</div>

<script>
const form = document.getElementById('loginForm');
const card = document.getElementById('loginCard');
const status = document.getElementById('loginStatus');
const btn = document.getElementById('loginBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('fUser').value;
  const password = document.getElementById('fPass').value;
  btn.disabled = true;
  status.textContent = 'Checking…';
  status.className = 'login-status';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (res.ok) {
      status.textContent = 'Access granted. Welcome back!';
      status.className = 'login-status ok';
      setTimeout(() => { location.href = '/'; }, 500);
    } else {
      throw new Error('invalid');
    }
  } catch (err) {
    status.textContent = 'Invalid username or password.';
    status.className = 'login-status error';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    btn.disabled = false;
  }
});
</script>
