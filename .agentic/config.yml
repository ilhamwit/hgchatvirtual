# .agentic/config.yml — per-project Agentic Workflow Kit manifest
# ---------------------------------------------------------------------------
# Generated by /agentic-init (mode: existing) on 2026-10-18. Review and commit.
# Machine-specific overrides go in `.agentic/config.local.yml` (gitignored).
# Any field left blank falls back to auto-detection at runtime.
# ---------------------------------------------------------------------------

project:
  name: hg-chat-center              # memory namespace root
  repo: ""                          # no git remote yet
  type: single-app

# No package.json yet (EPIC-000 T-005 adds one). npm is what ships with Node here.
package_manager: npm

monorepo:
  tool: none
  workspaces: []

branches:
  integration: main
  primary: main

# No separate DEV instance yet — EPIC-000 T-005 adds `npm run dev` on its own
# port + DB. Until then the deploy gate is disabled. NOTE: chat-center.service
# serves straight from this folder, so there is no deploy step to production:
# saving a file IS the production change (see conventions.notes).
deploy:
  dev_command: ""
  health_url: ""                    # EPIC-005 T-028 adds /healthz
  smoke_user: ""

protected_paths:
  - docs/epics/EPIC-template.md     # kit template; copy it, don't edit it

conventions:
  page_pattern: ""                  # single page today: hg-chat-ai-agent.html (+ login.html)
  shared_types: ""
  notes: >-
    LIVE FOLDER: systemd chat-center.service (port 8643, agents.herrygunawan.com)
    runs from this directory, so HTML edits go live on the next page load and
    server.js edits go live on restart; never restart the service from an agent,
    and test on a separate port. Vanilla Node (v26), no framework, no build step;
    prefer built-in modules (node:sqlite, node:crypto, node:test) over new
    dependencies. Secrets live only in ~/.config/chat-center.env. User-facing copy
    is Bahasa Indonesia. Agents (dave/jaden/joel/dylan/nana) are OpenClaw agents
    behind the gateway at 127.0.0.1:18789.

# Multi-user (EPIC-001/002) but not multi-tenant. Once EPIC-002 lands, consider
# [user_id] so review/security agents enforce per-user ownership checks.
tenant:
  scope_fields: []

guardrail:
  override_env: AGENTIC_OVERRIDE

gates:
  qa: scripts/qa.sh
  test: scripts/test.sh
  security: scripts/security-check.sh

loop:
  enabled: false
  pattern: daily-triage
  level: L1
  mode: report-only
  cadence: manual
  state_file: docs/LOOP-STATE.md
  run_log: docs/LOOP-RUN-LOG.md
  ledger: .agentic/loop-ledger.tsv
  constraints_file: .agentic/loop-constraints.md
  kill_switch: .agentic/loop.pause
  max_attempts_per_item: 3
  max_runs_per_day: 1
  token_budget_per_day: 100000
  max_subagents_per_run: 0
  worktree_required: true
  verifier_required: true
  human_gate: required

memory:
  enabled: true
  namespace: ""                     # = project.name
  warm_start: true
  top_k: 8

# Stories, acceptance criteria and tasks live inline in each epic file.
docs:
  root: docs
  prd: docs/product/PRD.md
  stories: docs/epics
  acceptance: docs/epics
  tasks: docs/epics
  backlog: docs/BACKLOG.md
  epics: docs/epics
  definition_of_done: docs/DEFINITION-OF-DONE.md
